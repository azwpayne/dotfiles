# Alacritty Configuration File (chezmoi: private_dot_config/alacritty/alacritty.toml -> ~/.config/alacritty/alacritty.toml)
# GPU-accelerated terminal. Theme: Dracula (this file only — ghostty & starship use Catppuccin Mocha).
# `private_dot_config` ensures parent dir 0700 on deploy.
# Docs: https://alacritty.org/config-alacritty.html | bindings: .../config-alacritty-bindings.html
# Reference: https://www.kevnu.com/zh/posts/18

[env]
TERM = "xterm-256color"  # ensure 256-color + truecolor in tmux/ssh

[font]
size = 15
# Requires JetBrainsMono Nerd Font Mono installed (via Homebrew `font-jetbrains-mono-nerd-font`).
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font Mono", style = "Bold Italic" }

# Palette: Dracula — ghostty & starship use Catppuccin Mocha (intentional split).
[colors]
primary = { background = '0x282a36', foreground = '0xf8f8f2' }
cursor = { background = '0x44475a', foreground = '0xf8f8f2' }
normal = { black = '0x21222c', red = '0xff5555', green = '0x50fa7b', yellow = '0xf1fa8c', blue = '0xbd93f9', magenta = '0xff79c6', cyan = '0x8be9fd', white = '0xbfbfbf' }
bright = { black = '0x4d4d4d', red = '0xff6e67', green = '0x5af78e', yellow = '0xf4f99d', blue = '0xcaa9fa', magenta = '0xff92d0', cyan = '0x9aedfe', white = '0xe6e6e6' }
dim = { black = '0x21222c', red = '0xff5555', green = '0x50fa7b', yellow = '0xf1fa8c', blue = '0xbd93f9', magenta = '0xff79c6', cyan = '0x8be9fd', white = '0xbfbfbf' }

[window]
blur = true                         # macOS translucent blur behind window
option_as_alt = "OnlyRight"         # left Option stays for input (e.g. umlauts), right Option = Alt/Meta
# dimensions = { columns = 120, lines = 35 }  # example: fixed startup size (disabled)
# decorations = "Buttonless"                  # example: hide traffic lights (disabled)
startup_mode = "Fullscreen"

[selection]
save_to_clipboard = true  # copy selection directly to system clipboard

[keyboard]
# Key bindings — see https://github.com/theniceboy/.config/blob/master/alacritty/alacritty.yml
bindings = [
  # { key = "Return", mods = "Command", action = "ToggleSimpleFullscreen" },
  { mods = "Command", key = "Enter", action = "ToggleFullscreen" },
  # { key = "N", mods = "Control", command = "tm" },
  # { key = "F", mods = "Function", action = "ToggleFullscreen" },
  # { key = "N", mods = "Alt", action = "ReceiveChar" },
  # { key = "P", mods = "Alt", action = "ReceiveChar" },
  { mods = "Command", key = "t", action = "None" },  # disable: let shell/tmux handle new tab
  { mods = "Command", key = "n", action = "None" },  # disable: let shell/tmux handle new window
]
