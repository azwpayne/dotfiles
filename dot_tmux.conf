# =============================================================================
# ~/.tmux.conf (chezmoi: dot_tmux.conf -> ~/.tmux.conf)
# =============================================================================
# Description : tmux 主配置 — Fish 为默认 shell，启用扩展键、鼠标与大历史；
#               插件经 tpm 管理，状态栏用 Catppuccin Mocha。
# Usage       : `tmux` 启动；修改后 `prefix + r` 重载或 `tmux source-file ~/.tmux.conf`
# Guards      : 依赖 Fish/tpm 已安装；无 Fish 时回退到系统 shell（tmux 默认）
#               插件未安装时 `run tpm` 静默跳过（首次需 `prefix + I` 安装）
# Last Updated: 2026-09-03 — 补全文件头、分组注释、收敛状态栏说明
# Author      : Payne
# =============================================================================

# ---------------------------------------------------------------------------
# General — 终端与 shell
# ---------------------------------------------------------------------------
set-option -g default-shell "/opt/homebrew/bin/fish"  # 登录 shell → Fish (与 Ghostty/Alacritty 一致)
set-option -g default-command "/opt/homebrew/bin/fish"

set -as terminal-overrides ",xterm-256color:RGB"      # 真彩支持
set -g mouse on
set -g history-limit 100000                            # 大回滚缓冲 (100k 行)

set -g extended-keys on                                # 扩展键 (CSI-u)，配合 Ghostty/Alacritty
set -as terminal-features 'xterm*:extkeys'
set -g extended-keys-format csi-u

set -g renumber-windows on                             # 关闭窗口后自动重编号
set -g set-clipboard on                                # 与系统剪贴板互通

# ---------------------------------------------------------------------------
# Key bindings
# ---------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"  # prefix+r 重载

# ---------------------------------------------------------------------------
# Plugins — tpm (https://github.com/tmux-plugins/tpm)
# Install: `prefix + I` (install) / `prefix + U` (update) / `prefix + alt+u` (uninstall)
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'

# General — sensible 默认、复制/粘贴增强
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-copy'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'

# Session persistence (按需启用 — 历史已注释，保留为模板)
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'
# set -g @resurrect-capture-pane-contents 'on'

# Vim/nvim 导航增强 (按需启用)
# set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-pain-control'
# set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# ---------------------------------------------------------------------------
# Status bar — Catppuccin Mocha
# ---------------------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1                              # 窗口/面板均从 1 开始

set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'

set -g @catppuccin_window_status_style "rounded"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# TPM 初始化（必须置于文件末尾）
run '~/.config/tmux/plugins/tpm/tpm'
